name: publish

# Publishes to npm when a GitHub release is published.
# No registry secret is stored anywhere: npm Trusted Publishing (OIDC) accepts a publish only
# from this repository + this workflow file + the "npm" environment.

on:
  release:
    types: [published]

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The release tag's commit must be on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: The release tag must match the package.json version
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: '*.tgz'
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      id-token: write # only this job can ask for the OIDC identity
    steps:
      # No checkout and no install here: this job publishes the file the build job made.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: npm must be 11.5.1 or newer (the floor for Trusted Publishing)
        run: |
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            console.log("npm " + process.argv[1] + (ok ? " supports" : " is too old for") + " Trusted Publishing");
            process.exit(ok ? 0 : 1);
          ' "$(npm -v)"
      - name: Publish exactly the tarball the build job produced
        run: |
          set -euo pipefail
          set -- ./*.tgz
          test "$#" -eq 1
          test -f "$1"
          npm stage publish "$1" --provenance --access public --ignore-scripts
